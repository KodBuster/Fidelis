# Amvera deploy config — https://docs.amvera.ru/applications/environments/nodejs-server.html
# Рекомендуемый тариф: Стандартный (2.5 ГБ RAM), регион: Москва
# Репозиторий GitHub: https://github.com/KodBuster/Fidelis

meta:
  environment: node
  toolchain:
    name: npm
    version: "20"

build:
  additionalCommands: npm ci --include=dev && npm run build
  # Только standalone-бандл: иначе "*" тащит node_modules + .next (~800+ МБ)
  # и скачивание артефакта из S3 часто падает с 403.
  artifacts:
    amvera-bundle: /

run:
  # Не использовать sh -c — shell в runtime Amvera часто отсутствует
  command: node amvera-bundle/run.mjs
  containerPort: 80
  persistenceMount: /data
