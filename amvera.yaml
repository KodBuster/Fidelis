# Amvera deploy config — https://docs.amvera.ru/applications/environments/nodejs-server.html
# Рекомендуемый тариф: Стандартный (2.5 ГБ RAM), регион: Москва
# Репозиторий GitHub: https://github.com/KodBuster/Fidelis

meta:
  environment: node
  toolchain:
    name: npm
    version: "20"

build:
  # npm install уже делает Amvera; ci + build — чтобы в артефакт попал standalone.
  additionalCommands: npm ci --include=dev && npm run build
  # В UI Amvera часто можно указать только один ключ artifacts.
  # amvera-bundle — нескрытая копия .next/standalone (см. prepare-standalone.mjs).
  artifacts:
    "amvera-bundle": /

run:
  # cwd = amvera-bundle — корректные пути к .next/static и public
  command: sh -c "cd amvera-bundle && exec node server.js"
  containerPort: 80
  # Счётчик заказов (src/lib/order-sequence.ts) пишет в /data при AMVERA=1
  persistenceMount: /data
